<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>인생 이야기 전자책</title>
  <meta name="description" content="인터뷰 녹음으로 엮은 한 사람의 인생 이야기">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/book.css">
</head>
<body>
  <div id="book" class="reader">
    <p style="margin:auto;padding:40px 16px;font-family:var(--sans);color:var(--muted)">책을 펼치는 중…</p>
  </div>

  <script src="/assets/book-render.js"></script>
  <script src="/assets/library.js"></script>
  <script>
    (async function () {
      var root = document.getElementById("book");
      var params = new URLSearchParams(location.search);
      var id = params.get("id");
      var book = null;
      var editable = false;
      var warned = false;

      if (params.has("sample") || id === "sample") {
        try {
          var res = await fetch("/books/sample.json");
          book = res.ok ? await res.json() : null;
        } catch (e) {}
      } else if (id) {
        book = Library.get(id);
        editable = !!book;
      }

      if (!book) {
        root.innerHTML =
          '<div style="margin:auto;padding:48px 16px;text-align:center;font-family:var(--sans)">' +
          '<p style="font-size:1.1rem;margin:0 0 8px">책을 찾을 수 없습니다.</p>' +
          '<p style="color:var(--muted);margin:0 0 24px">만든 책은 만든 기기의 브라우저에만 저장됩니다.</p>' +
          '<a class="btn" href="/">서재로 가기</a></div>';
        return;
      }

      var config = {};
      if (editable) {
        try { config = await (await fetch("/api/config")).json(); } catch (e) {}
      }

      ChronicleBook.mount(root, book, {
        homeHref: "/",
        onChange: editable
          ? function (b) {
              if (!Library.save(b) && !warned) {
                warned = true;
                alert("브라우저 저장 공간이 부족해 고친 내용을 저장하지 못했습니다. 서재에서 ‘파일로 저장’으로 책을 내려받아 두세요.");
              }
            }
          : null,
        onPublish: editable && config.publishing ? publish : null,
        onUnpublish: editable && config.publishing ? unpublish : null,
        publishedUrl: book.published ? linkTo(book.published.id) : null,
      });

      function linkTo(id) { return location.origin + "/read?id=" + id; }

      // Calls /api/publish with the access code this device remembers; asks for it once if it
      // is missing or wrong.
      async function call(method, body) {
        var code = "";
        try { code = localStorage.getItem("chronicle:access") || ""; } catch (e) {}
        for (var tries = 0; ; tries++) {
          var res = await fetch("/api/publish", {
            method: method,
            headers: Object.assign({ "content-type": "application/json" }, code ? { "x-access-code": encodeURIComponent(code) } : {}),
            body: JSON.stringify(body),
          });
          var data = {};
          try { data = await res.json(); } catch (e) {}
          if (res.status === 401 && tries === 0) {
            code = (prompt("접근 코드") || "").trim();
            try { localStorage.setItem("chronicle:access", code); } catch (e) {}
            if (code) continue;
          }
          if (!res.ok) throw new Error(data.error || "다시 시도해 주세요.");
          return data;
        }
      }

      // Uploads the book as a read-only page; publishing again updates the same link.
      async function publish(b) {
        var copy = Object.assign({}, b);
        delete copy.published;
        var p = b.published || {};
        var data = await call("POST", { book: copy, id: p.id, token: p.token });
        b.published = { id: data.id, token: data.token || p.token };
        Library.save(b);
        return linkTo(data.id);
      }

      async function unpublish(b) {
        await call("DELETE", { id: b.published.id, token: b.published.token });
        delete b.published;
        Library.save(b);
      }
    })();
  </script>
</body>
</html>
