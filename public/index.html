<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>인생 이야기 전자책</title>
  <meta name="description" content="인터뷰 녹음 하나로 한 사람의 삶을 연대기 전자책으로 엮어 드립니다.">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <h1 class="side__brand"><a class="brand" href="/">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 5.5h6a2.5 2.5 0 0 1 2.5 2.5v11a2 2 0 0 0-2-2H3.5zM20.5 5.5h-6A2.5 2.5 0 0 0 12 8v11a2 2 0 0 1 2-2h6.5z"/></svg>
      <span>인생 이야기 전자책</span>
    </a></h1>

    <section id="library" class="shelf" hidden>
      <h2 class="shelf__title">내 서재</h2>
      <ul id="library-list" class="library"></ul>
    </section>
  </aside>

  <main class="main">
    <div id="notice" class="notice" role="status" hidden></div>

    <div id="resume" class="banner" hidden>
      <p id="resume-text"></p>
      <div class="banner__actions">
        <button id="resume-go" type="button" class="primary">이어서 쓰기</button>
        <button id="resume-drop" type="button" class="btn">버리기</button>
      </div>
    </div>

    <form id="builder" novalidate>
      <h2 class="visually-hidden">새 책 만들기</h2>
      <fieldset id="form-fields" class="form-fields">

      <section class="step" aria-labelledby="step1-title">
        <h3 class="step__title" id="step1-title"><span class="step__num">1</span> 녹음 올리기</h3>
        <label id="dropzone" class="dropzone">
          <input id="audio-file" type="file" accept="audio/*,video/mp4,.m4a,.mp3,.wav,.aac,.ogg,.flac,.webm">
          <span class="dropzone__icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M4.5 14.5v3a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-3"/></svg></span>
          <span class="dropzone__main" id="dropzone-main">녹음 파일을 끌어다 놓거나 눌러서 고르세요</span>
        </label>
        <p id="file-info" class="file-info" role="status" hidden></p>
        <p id="tx-resume" class="banner" hidden></p>

        <label class="field">
          <span class="field__label">녹음에 나오는 이름·지명·용어 <em>(선택)</em></span>
          <input id="hint" type="text" maxlength="300">
        </label>

      </section>

      <section class="step" aria-labelledby="step2-title">
        <h3 class="step__title" id="step2-title"><span class="step__num">2</span> 책 정보</h3>
        <div class="grid2">
          <label class="field">
            <span class="field__label">주인공 이름</span>
            <input id="subject" type="text" maxlength="60" autocomplete="off">
          </label>
          <label class="field">
            <span class="field__label">직함·소속 <em>(선택)</em></span>
            <input id="role" type="text" maxlength="80" autocomplete="off">
          </label>
          <label class="field">
            <span class="field__label">인터뷰한 사람</span>
            <input id="interviewer" type="text" maxlength="60" autocomplete="off">
          </label>
          <label class="field">
            <span class="field__label">인터뷰 날짜</span>
            <input id="date" type="date">
          </label>
          <label class="field">
            <span class="field__label">인터뷰 장소</span>
            <input id="place" type="text" maxlength="60">
          </label>
        </div>

        <div class="field">
          <span class="field__label" id="voice-label">문체</span>
          <div class="choices" role="radiogroup" aria-labelledby="voice-label">
            <label class="choice">
              <input type="radio" name="voice" value="first" checked>
              <span><b>1인칭 회고록</b><small>"나는 서천 바닷가에서 태어났다."</small></span>
            </label>
            <label class="choice">
              <input type="radio" name="voice" value="third">
              <span><b>3인칭 전기</b><small>"그는 서천 바닷가에서 태어났다."</small></span>
            </label>
            <label class="choice">
              <input type="radio" name="voice" value="oral">
              <span><b>구술 정리</b><small>"저는 서천 바닷가에서 났어요."</small></span>
            </label>
          </div>
        </div>

        <div class="grid2">
          <label class="field">
            <span class="field__label">장 수</span>
            <select id="chapters">
              <option value="12" selected>자동</option>
              <option value="2">최대 2장</option>
              <option value="3">최대 3장</option>
              <option value="4">최대 4장</option>
              <option value="5">최대 5장</option>
              <option value="6">최대 6장</option>
              <option value="8">최대 8장</option>
              <option value="10">최대 10장</option>
            </select>
          </label>
        </div>
      </section>
      </fieldset>

      <div class="actions">
        <p id="make-error" class="error" role="alert" hidden></p>
        <button id="make-btn" type="submit" class="primary primary--big">전자책 만들기</button>
      </div>

      <div id="make-progress" class="make-progress" hidden>
        <div class="overall">
          <div class="progress__bar" role="progressbar" aria-label="책 만들기 진행" aria-valuemin="0" aria-valuemax="100"><span id="overall-bar"></span></div>
          <p class="overall__text"><span id="overall-status" role="status"></span><span id="overall-eta"></span></p>
        </div>
        <ol id="make-steps" class="make-steps"></ol>
        <button id="retry-btn" type="button" class="primary primary--big" hidden>이어서 쓰기</button>
        <button id="restart-btn" type="button" class="link-btn" hidden>처음부터 다시 만들기</button>
      </div>
    </form>

    <p id="balance" class="balance" hidden></p>
  </main>
</div>

  <dialog id="gate" class="gate">
    <form id="gate-form">
      <label class="field">
        <span class="field__label">접근 코드</span>
        <input id="gate-code" type="password" autocomplete="current-password" required>
      </label>
      <p id="gate-error" class="error" role="alert" hidden></p>
      <button type="submit" class="primary">확인</button>
    </form>
  </dialog>

  <script src="/assets/library.js"></script>
  <script src="/assets/audio.js"></script>
  <script src="/assets/builder.js"></script>
</body>
</html>
